# CocinApp — sitio Netlify independiente
# Sitio Netlify conectado al repositorio Cocinapp (base directory = raíz)
[build]
  publish   = "public"
  functions = "netlify/functions"
  # Omite el deploy si no hubo cambios desde el último
  ignore    = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[functions]
  node_bundler = "esbuild"
